# Fabrica el instalador de FENIX APP para Windows (.exe) en una máquina Windows de GitHub.
# Cada cambio en main lo publica en "Releases" como la versión de package.json (v1.1.0, v1.2.0…),
# junto con latest.yml, que es lo que lee el programa instalado para actualizarse solo.
# Para sacar una versión nueva basta con subir "version" en package.json. Si esa versión ya estaba
# publicada hace rato, no se toca. El instalador también queda en "Actions" → la ejecución → "Artifacts".
name: App de escritorio (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probar la base de datos
        run: npm run probar:bd

      - name: Fabricar y publicar la versión en Releases
        run: npm run publicar:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: FENIX-APP-Windows
          path: release/*.exe
          if-no-files-found: error
